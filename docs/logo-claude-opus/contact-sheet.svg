<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" role="img" aria-labelledby="sheet-title">
  <title id="sheet-title">ytmp3 logo exploration by Claude Opus: four concepts at 128, 48 and 24 px on light and dark backgrounds</title>
  <defs>
    <mask id="drop-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <path d="M56 282q50 52 100 0t100 0t100 0t100 0" fill="none" stroke="#000" stroke-width="26" stroke-linecap="round"/>
    </mask>

    <!-- Launcher tiles: identical geometry to the individual SVG files. -->
    <symbol id="a" viewBox="0 0 512 512">
      <rect width="512" height="512" rx="112" fill="#102822"/>
      <path d="M256 108C296 164 356 222 356 282A100 100 0 0 1 156 282C156 222 216 164 256 108Z" fill="#70d7b4" mask="url(#drop-cut)"/>
    </symbol>
    <symbol id="b" viewBox="0 0 512 512">
      <rect width="512" height="512" rx="112" fill="#146d54"/>
      <path d="M400 196C379 196 366 160 345 160S311 196 290 196S256 160 235 160S201 196 180 196A60 60 0 0 0 180 316C201 316 214 352 235 352S269 316 290 316S324 352 345 352S379 316 400 316" transform="translate(-4 0)" fill="none" stroke="#f0f6f4" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="c" viewBox="0 0 512 512">
      <rect x="2" y="2" width="508" height="508" rx="110" fill="#dce7e1" stroke="#cad7d0" stroke-width="4"/>
      <g fill="#15221e">
        <rect x="136" y="160" width="40" height="176" rx="10"/>
        <rect x="196" y="208" width="40" height="128" rx="10"/>
        <rect x="256" y="128" width="40" height="208" rx="10"/>
      </g>
      <rect x="336" y="160" width="40" height="176" rx="10" fill="#146d54" transform="rotate(-12 336 336)"/>
      <path d="M120 368H392" fill="none" stroke="#15221e" stroke-width="32" stroke-linecap="round"/>
    </symbol>
    <symbol id="d" viewBox="0 0 512 512">
      <rect width="512" height="512" rx="112" fill="#172123"/>
      <g fill="#f0f6f4">
        <circle cx="360" cy="256" r="30"/>
        <circle cx="308" cy="346.07" r="30"/>
        <circle cx="204" cy="346.07" r="30"/>
        <circle cx="152" cy="256" r="30"/>
        <circle cx="204" cy="165.93" r="30"/>
        <circle cx="308" cy="165.93" r="30"/>
      </g>
      <circle cx="256" cy="256" r="42" fill="#70d7b4"/>
    </symbol>

    <!-- Navigation glyphs: tile removed, single colour, cropped to the mark. -->
    <symbol id="a-nav" viewBox="80 80 352 352">
      <path d="M256 108C296 164 356 222 356 282A100 100 0 0 1 156 282C156 222 216 164 256 108Z" fill="currentColor" mask="url(#drop-cut)"/>
    </symbol>
    <symbol id="b-nav" viewBox="80 80 352 352">
      <path d="M400 196C379 196 366 160 345 160S311 196 290 196S256 160 235 160S201 196 180 196A60 60 0 0 0 180 316C201 316 214 352 235 352S269 316 290 316S324 352 345 352S379 316 400 316" transform="translate(-4 0)" fill="none" stroke="currentColor" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="c-nav" viewBox="80 80 352 352">
      <g fill="currentColor">
        <rect x="136" y="160" width="40" height="176" rx="10"/>
        <rect x="196" y="208" width="40" height="128" rx="10"/>
        <rect x="256" y="128" width="40" height="208" rx="10"/>
        <rect x="336" y="160" width="40" height="176" rx="10" transform="rotate(-12 336 336)"/>
      </g>
      <path d="M120 368H392" fill="none" stroke="currentColor" stroke-width="32" stroke-linecap="round"/>
    </symbol>
    <symbol id="d-nav" viewBox="80 80 352 352">
      <g fill="currentColor">
        <circle cx="360" cy="256" r="30"/>
        <circle cx="308" cy="346.07" r="30"/>
        <circle cx="204" cy="346.07" r="30"/>
        <circle cx="152" cy="256" r="30"/>
        <circle cx="204" cy="165.93" r="30"/>
        <circle cx="308" cy="165.93" r="30"/>
        <circle cx="256" cy="256" r="42"/>
      </g>
    </symbol>
  </defs>

  <rect width="1240" height="620" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="40" y="42" font-size="22" font-weight="600" fill="#15221e">ytmp3 logo exploration by Claude Opus</text>
    <text x="40" y="66" font-size="13" fill="#52645e">Four concepts at 128, 48 and 24 px launcher tiles, plus a single-colour 24 px navigation glyph</text>

    <g font-size="16" font-weight="600" fill="#15221e">
      <text x="40" y="106">A · Drop <tspan font-size="12" font-weight="600" fill="#146d54">RECOMMENDED</tspan></text>
      <text x="340" y="106">B · Fork</text>
      <text x="640" y="106">C · Shelf</text>
      <text x="940" y="106">D · Grille</text>
    </g>
    <g font-size="12" fill="#52645e">
      <text x="40" y="126">Audio distilled from a link</text>
      <text x="340" y="126">A link loop that rings like a tuning fork</text>
      <text x="640" y="126">A small shelf of sound: your library</text>
      <text x="940" y="126">A quiet speaker grille, one lit centre</text>
    </g>

    <!-- Light band -->
    <rect y="140" width="1240" height="200" fill="#f2f5f3"/>
    <g font-size="11" fill="#52645e">
      <text x="40" y="164">LIGHT #f2f5f3</text>
      <text x="40" y="328">128 px</text><text x="340" y="328">128 px</text><text x="640" y="328">128 px</text><text x="940" y="328">128 px</text>
      <text x="224" y="209">48 px</text><text x="524" y="209">48 px</text><text x="824" y="209">48 px</text><text x="1124" y="209">48 px</text>
      <text x="224" y="260">24 px</text><text x="524" y="260">24 px</text><text x="824" y="260">24 px</text><text x="1124" y="260">24 px</text>
      <text x="224" y="300">24 px nav</text><text x="524" y="300">24 px nav</text><text x="824" y="300">24 px nav</text><text x="1124" y="300">24 px nav</text>
    </g>
    <use href="#a" x="40" y="180" width="128" height="128"/>
    <use href="#b" x="340" y="180" width="128" height="128"/>
    <use href="#c" x="640" y="180" width="128" height="128"/>
    <use href="#d" x="940" y="180" width="128" height="128"/>
    <use href="#a" x="200" y="180" width="48" height="48"/>
    <use href="#b" x="500" y="180" width="48" height="48"/>
    <use href="#c" x="800" y="180" width="48" height="48"/>
    <use href="#d" x="1100" y="180" width="48" height="48"/>
    <use href="#a" x="200" y="243" width="24" height="24"/>
    <use href="#b" x="500" y="243" width="24" height="24"/>
    <use href="#c" x="800" y="243" width="24" height="24"/>
    <use href="#d" x="1100" y="243" width="24" height="24"/>
    <g color="#15221e">
      <use href="#a-nav" x="200" y="283" width="24" height="24"/>
      <use href="#b-nav" x="500" y="283" width="24" height="24"/>
      <use href="#c-nav" x="800" y="283" width="24" height="24"/>
      <use href="#d-nav" x="1100" y="283" width="24" height="24"/>
    </g>

    <!-- Dark band -->
    <rect y="340" width="1240" height="200" fill="#101819"/>
    <g font-size="11" fill="#9badab">
      <text x="40" y="364">DARK #101819</text>
      <text x="40" y="528">128 px</text><text x="340" y="528">128 px</text><text x="640" y="528">128 px</text><text x="940" y="528">128 px</text>
      <text x="224" y="409">48 px</text><text x="524" y="409">48 px</text><text x="824" y="409">48 px</text><text x="1124" y="409">48 px</text>
      <text x="224" y="460">24 px</text><text x="524" y="460">24 px</text><text x="824" y="460">24 px</text><text x="1124" y="460">24 px</text>
      <text x="224" y="500">24 px nav</text><text x="524" y="500">24 px nav</text><text x="824" y="500">24 px nav</text><text x="1124" y="500">24 px nav</text>
    </g>
    <use href="#a" x="40" y="380" width="128" height="128"/>
    <use href="#b" x="340" y="380" width="128" height="128"/>
    <use href="#c" x="640" y="380" width="128" height="128"/>
    <use href="#d" x="940" y="380" width="128" height="128"/>
    <use href="#a" x="200" y="380" width="48" height="48"/>
    <use href="#b" x="500" y="380" width="48" height="48"/>
    <use href="#c" x="800" y="380" width="48" height="48"/>
    <use href="#d" x="1100" y="380" width="48" height="48"/>
    <use href="#a" x="200" y="443" width="24" height="24"/>
    <use href="#b" x="500" y="443" width="24" height="24"/>
    <use href="#c" x="800" y="443" width="24" height="24"/>
    <use href="#d" x="1100" y="443" width="24" height="24"/>
    <g color="#f0f6f4">
      <use href="#a-nav" x="200" y="483" width="24" height="24"/>
      <use href="#b-nav" x="500" y="483" width="24" height="24"/>
      <use href="#c-nav" x="800" y="483" width="24" height="24"/>
      <use href="#d-nav" x="1100" y="483" width="24" height="24"/>
    </g>

    <g font-size="12" fill="#52645e">
      <text x="40" y="572">All fills use existing app tokens: #102822, #70d7b4, #146d54, #f0f6f4, #172123, #dce7e1, #cad7d0, #15221e.</text>
      <text x="40" y="594">Nav glyphs are the same geometry without the tile, drawn in currentColor. Recommended: A · Drop.</text>
    </g>
  </g>
</svg>
