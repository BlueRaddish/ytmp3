[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytmp3"
version = "0.4.0"
description = "yt-dlp URL-to-MP3 wrapper and personal media player"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BlueRaddish" }]
keywords = ["yt-dlp", "mp3", "media-player", "rclone"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = ["yt-dlp>=2024.1.1", "tinytag>=2.3,<3"]

[project.urls]
Homepage = "https://github.com/BlueRaddish/ytmp3"
Issues = "https://github.com/BlueRaddish/ytmp3/issues"

[project.scripts]
ytmp3 = "ytmp3.cli:main"

[tool.setuptools.packages.find]
include = ["ytmp3*"]

[tool.setuptools.package-data]
ytmp3 = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
