<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101b1c">
  <meta name="description" content="A personal MP3 library and yt-dlp URL downloader.">
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <link rel="icon" href="/icon-192.png" sizes="192x192">
  <link rel="stylesheet" href="/app.css">
  <script src="/playlist-store.js" defer></script>
  <script src="/app.js" defer></script>
  <title>ytmp3 · your audio library</title>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">y</span><span>ytmp3<small>Personal audio</small></span></div>
      <nav class="navigation" aria-label="Main navigation">
        <button type="button" data-view="library" class="nav-item active"><span aria-hidden="true">▦</span><span>Library</span></button>
        <button type="button" data-view="playlists" class="nav-item"><span aria-hidden="true">♫</span><span>Playlists</span></button>
        <button type="button" data-view="queue" class="nav-item"><span aria-hidden="true">≡</span><span>Queue</span><span id="queue-count" class="nav-count">0</span></button>
        <button type="button" data-view="settings" class="nav-item"><span aria-hidden="true">⚙</span><span>Settings</span></button>
        <button type="button" data-view="about" class="nav-item"><span aria-hidden="true">ⓘ</span><span>About</span></button>
      </nav>
      <p class="sidebar-credit">Downloads powered by <a href="https://github.com/yt-dlp/yt-dlp" target="_blank" rel="noopener noreferrer">yt-dlp</a></p>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="top-title"><span class="mobile-mark" aria-hidden="true">y</span><span id="page-title">Library</span></div>
        <div class="top-actions">
          <span id="connection" class="connection" role="status">Connecting…</span>
          <button id="theme-button" class="icon-button" type="button" aria-label="Switch theme">◐</button>
        </div>
      </header>
      <div id="offline-banner" class="offline-banner" role="status" hidden></div>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>

  <div class="player" id="player">
    <div class="player-header"><span>Now playing</span><button id="close-player" class="icon-button" type="button" aria-label="Close player">×</button></div>
    <button class="player-track" id="expand-player" type="button" aria-label="Open player" aria-expanded="false">
      <div class="player-art" aria-hidden="true">♪</div>
      <div class="player-copy"><strong id="player-title">Nothing playing</strong><span id="player-subtitle">Choose a file from your library</span></div>
    </button>
    <div class="player-center">
      <div class="transport">
        <button id="shuffle" class="icon-button" type="button" aria-label="Shuffle off" aria-pressed="false">⇄</button>
        <button id="previous" class="icon-button" type="button" aria-label="Previous track">⏮</button>
        <button id="play" class="play-button" type="button" aria-label="Play">▶</button>
        <button id="next" class="icon-button" type="button" aria-label="Next track">⏭</button>
        <button id="repeat" class="icon-button" type="button" aria-label="Repeat off">↻</button>
      </div>
      <div class="timeline">
        <span id="elapsed">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek position">
        <span id="duration">0:00</span>
      </div>
    </div>
    <div class="player-extra">
      <button id="speed" type="button" class="text-button" aria-label="Playback speed">1×</button>
      <label class="volume-control"><span aria-hidden="true">◖</span><span class="sr-only">Volume</span><input id="volume" type="range" min="0" max="100" value="100" aria-label="Volume"></label>
    </div>
    <audio id="audio" preload="metadata"></audio>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="playlist-dialog" aria-labelledby="playlist-dialog-title">
    <form method="dialog" id="playlist-picker">
      <h2 id="playlist-dialog-title">Add to playlist</h2>
      <label for="playlist-choice">Playlist</label>
      <select id="playlist-choice"></select>
      <label for="playlist-new">Or create a new playlist</label>
      <input id="playlist-new" type="text" maxlength="80" placeholder="New playlist name">
      <div class="dialog-actions"><button type="button" class="row-button" id="playlist-cancel">Cancel</button>
        <button type="submit" class="primary-button">Add track</button></div>
    </form>
  </dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <form method="dialog"><h2 id="confirm-title">Delete playlist?</h2><p id="confirm-text"></p>
      <div class="dialog-actions"><button class="row-button" value="cancel">Cancel</button>
        <button class="primary-button" value="delete">Delete playlist</button></div></form>
  </dialog>
</body>
</html>
